name: dashboard

# Refreshes the markdown stats block inside README.md, between the STATS
# markers, from the GitHub API.
#
# The contribution grid is the snake's job, in snake.yml. This used to also
# render a calendar card and compose the snake into it; one figure was
# simpler to look at but harder to keep working, so the snake stands on its
# own again and this workflow only keeps the numbers current.
#
# Both are committed rather than fetched from a third-party card service,
# because those go down -- at the time this was written the public
# instances of github-readme-stats, github-profile-trophy and
# github-readme-activity-graph were all returning 402/503. The markdown
# block additionally stays real text: selectable, diffable, and themed by
# GitHub itself rather than baked into a picture.

on:
  schedule:
    - cron: "17 4 * * *"          # 04:17 UTC daily
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

env:
  # The generator writes the list of files it produced here, and the commit
  # step stages exactly that list -- so adding an asset cannot silently go
  # uncommitted the way it did when this workflow named one file by hand.
  ASSET_MANIFEST: /tmp/dashboard-assets.txt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate figures
        env:
          # METRICS_TOKEN is optional: a classic PAT with read:user also counts
          # private contributions. Without it the default token still works and
          # simply reports public activity only.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          python scripts/build_tables.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -a "$ASSET_MANIFEST" git add --
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore(assets): refresh dashboard and stats"
            git push
          fi
