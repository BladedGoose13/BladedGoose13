name: snake

# Renders the contribution grid as a snake animation, in the profile palette.
# Committed into the repo (rather than an orphan output branch) so it lives
# beside the other generated assets and the README can use a relative path.

on:
  schedule:
    - cron: "37 5 * * *"          # 05:37 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots takes exactly 5 entries: empty cell, then low -> high.
          # Two outputs, one per GitHub theme; the README picks with <picture>.
          # These must track scripts/palette.py -- they drifted once already.
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#C08040&color_dots=#1E1B30,#73421A,#8F5422,#AD642E,#E58C36
            assets/snake-light.svg?palette=github-light&color_snake=#8A5520&color_dots=#E2DCEC,#EC933E,#D8730A,#BC590A,#74370A

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-light.svg
          if git diff --staged --quiet; then
            echo "snake unchanged"
          else
            git commit -m "chore(assets): refresh contribution snake"
            git push
          fi
