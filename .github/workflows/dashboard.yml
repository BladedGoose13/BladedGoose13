name: dashboard

# Regenerates assets/dashboard.svg from live GitHub data and commits it.
# The SVG is committed rather than fetched from a third-party card service
# because those services go down: at the time this was written the public
# instances of github-readme-stats, github-profile-trophy and
# github-readme-activity-graph were all returning 402/503.

on:
  schedule:
    - cron: "17 4 * * *"          # 04:17 UTC daily
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate dashboard
        env:
          # METRICS_TOKEN is optional: a classic PAT with read:user also counts
          # private contributions. Without it the default token still works and
          # simply reports public activity only.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/build_dashboard.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          if git diff --staged --quiet; then
            echo "dashboard unchanged"
          else
            git commit -m "chore(assets): refresh dashboard"
            git push
          fi
