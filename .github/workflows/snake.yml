name: snake

# Renders the contribution grid as a snake animation, in the profile palette.
# Committed into the repo (rather than an orphan output branch) so it lives
# beside the other generated assets and the README can use a relative path.

on:
  schedule:
    - cron: "37 5 * * *"          # 05:37 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots takes exactly 5 entries: empty cell, then low -> high.
          outputs: |
            assets/snake.svg?palette=github-light&color_snake=#C0562F&color_dots=#E5D9C2,#CB955D,#B97F43,#A56B2D,#774711

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --staged --quiet; then
            echo "snake unchanged"
          else
            git commit -m "chore(assets): refresh contribution snake"
            git push
          fi
